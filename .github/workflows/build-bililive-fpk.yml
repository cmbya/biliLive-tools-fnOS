name: Build biliLive-tools fnOS FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选：手动指定 biliLive-tools 版本，例如 3.20.0；留空则使用上游最新正式版"
        required: false
        type: string

  schedule:
    - cron: "37 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取目标版本
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_VERSION:-}" ]; then
            TAG="${MANUAL_VERSION#v}"
            echo "手动指定版本: $TAG"
          else
            echo "自动获取 biliLive-tools 最新正式 Release..."

            set +e

            LATEST_URL="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 4 \
                --retry-delay 3 \
                --retry-all-errors \
                --connect-timeout 15 \
                --max-time 90 \
                --output /dev/null \
                --write-out '%{url_effective}' \
                'https://github.com/renmu123/biliLive-tools/releases/latest'
            )"

            CURL_EXIT=$?

            set -e

            if [ "$CURL_EXIT" -eq 0 ] && \
               [[ "$LATEST_URL" == */releases/tag/* ]]; then

              TAG="${LATEST_URL##*/}"
              TAG="${TAG#v}"

              echo "✅ 最新 Release: $TAG"
            else
              echo "⚠️ Release 网页获取失败，改用 Git Tags"

              TAG="$(
                git ls-remote \
                  --tags \
                  --refs \
                  https://github.com/renmu123/biliLive-tools.git \
                | awk '{print $2}' \
                | sed 's#refs/tags/##' \
                | sed 's/^v//' \
                | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1
              )"

              if [ -z "$TAG" ]; then
                echo "❌ 无法取得最新正式版本"
                exit 1
              fi

              echo "✅ Git Tags 最新正式版本: $TAG"
            fi
          fi

          VERSION="${TAG#v}"
          PACK_REV="$(tr -d '[:space:]' < PACK_REV)"
          RELEASE_TAG="fnos-${VERSION}-${PACK_REV}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pack_rev=$PACK_REV" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "目标上游版本: $VERSION"
          echo "飞牛封装版本: $PACK_REV"

      - name: 检查是否已经发布
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已经存在 $RELEASE_TAG，本次无需重复构建。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 验证上游与 native2 时间补丁兼容
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          echo "验证 biliLive-tools / bililive-cli: $VERSION"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          cd "$TMP_DIR"

          printf '%s\n' \
            '{"name":"bililive-native2-check","private":true}' \
            > package.json

          export npm_config_force=true
          export SKIP_NTSUSPEND_BINARY=1

          npm install \
            --force \
            --omit=dev \
            --no-audit \
            --no-fund \
            "bililive-cli@${VERSION}"

          CLI_ROOT="$TMP_DIR/node_modules/bililive-cli/lib"
          test -d "$CLI_ROOT"

          echo ""
          echo "========== bililive-cli CJS bundle =========="
          find "$CLI_ROOT" -type f -name '*.cjs' -print

          echo ""
          echo "========== 验证真实 npm bundle =========="

          python3 - "$CLI_ROOT" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])

          start_pattern = re.compile(
              r"if\s*\(\s*!ignoreDataLimit\s*&&\s*"
              r"isBetweenTimeRange\(\s*recorder\.handleTime\s*\)"
              r"\s*\)\s*return\s*;?"
          )

          batch_pattern = re.compile(
              r'(\.filter\(\s*\(r\)\s*=>\s*'
              r'r\.providerId\s*===\s*["\']Bilibili["\']\s*\))'
          )

          files = list(root.rglob("*.cjs"))
          if not files:
              raise SystemExit("❌ bililive-cli/lib 中没有 CJS 文件")

          candidates = []
          for path in files:
              text = path.read_text(encoding="utf-8", errors="ignore")
              score = sum(
                  item in text
                  for item in (
                      "ignoreDataLimit",
                      "isBetweenTimeRange",
                      "handleBatchQuery",
                      'providerId === "Bilibili"',
                  )
              )
              if score >= 2:
                  candidates.append((score, path, text))

          if not candidates:
              raise SystemExit("❌ 没找到录制管理器所在的 CJS bundle")

          found = None
          for score, path, text in sorted(
              candidates,
              key=lambda item: (-item[0], len(str(item[1]))),
          ):
              start_count = len(list(start_pattern.finditer(text)))
              handle_pos = text.find("const handleBatchQuery")
              need_pos = text.find(
                  "const needCheckRecorders",
                  handle_pos if handle_pos >= 0 else 0,
              )

              if handle_pos >= 0 and need_pos > handle_pos:
                  batch_count = len(
                      list(
                          batch_pattern.finditer(
                              text[handle_pos:need_pos]
                          )
                      )
                  )
              else:
                  batch_count = 0

              print(
                  f"{path.name}: score={score}, "
                  f"startRecord={start_count}, BilibiliBatch={batch_count}"
              )

              if start_count == 1 and batch_count == 1:
                  found = path
                  break

          if found is None:
              raise SystemExit("❌ npm bundle 结构与 native2 补丁不兼容")

          print("")
          print("✅ 找到真实录制管理器 bundle：", found)
          print("✅ startRecord 补丁点：1")
          print("✅ Bilibili batch 补丁点：1")
          print("✅ native2 时间补丁兼容性检查通过")
          PY

      - name: 构建 x86 FPK
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x ./scripts/build_fpk.sh
          ./scripts/build_fpk.sh \
            "${{ steps.version.outputs.version }}"

      - name: 上传 Actions 构建产物
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: biliLive-tools-${{ steps.version.outputs.version }}-${{ steps.version.outputs.pack_rev }}-fnOS-x86
          path: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: 创建 GitHub Pre-release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACK_REV: ${{ steps.version.outputs.pack_rev }}
        run: |
          cat > /tmp/release-notes.md <<EOF2
          自动检测到上游 biliLive-tools **${VERSION}**，并生成 fnOS x86 原生 FPK。

          - 上游版本：${VERSION}
          - fnOS 封装：${PACK_REV}
          - 架构：x86 / amd64
          - Docker：不使用
          - native2：修复监控时间段提前录制
          - Bilibili：修复批量查询绕过 handleTime
          - startRecord：修复反向时间判断
          - 日志：录像目录/biliLive-tools-Logs
          - 升级：保留应用配置、账号/任务数据和录像目录

          **这是自动构建的 Pre-release。**
          EOF2

          gh release create "$RELEASE_TAG" \
            dist/*.fpk \
            dist/SHA256SUMS.txt \
            --title "biliLive-tools ${VERSION} fnOS x86 (${PACK_REV})" \
            --notes-file /tmp/release-notes.md \
            --prerelease
